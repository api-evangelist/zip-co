openapi: 3.2.0
info:
  title: Gateway Checkouts API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: Checkouts
paths:
  /global/v1/checkouts:
    post:
      tags:
      - Checkouts
      summary: Creates a checkout session for a merchant
      operationId: CreateCheckout
      parameters:
      - name: Referer
        in: header
        schema:
          type: string
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.CreateCheckoutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.CreateCheckoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /global/v1/checkouts/{checkoutId}:
    get:
      tags:
      - Checkouts
      summary: Retrieves a checkout session by ID
      operationId: GetCheckout
      parameters:
      - name: checkoutId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: merchantId
        in: query
        schema:
          type: string
          format: uuid
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.GetCheckoutResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
