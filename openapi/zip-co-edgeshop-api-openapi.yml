openapi: 3.2.0
info:
  title: Gateway Edge Shop API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: EdgeShop
paths:
  /edge/shop:
    post:
      tags:
      - EdgeShop
      summary: Edge entry point.
      operationId: Shop
      parameters:
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.MicrosoftEdge.Commands.AuthorizeEdgeShop'
      responses:
        '302':
          description: Found
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
components:
  schemas:
    QuadPay.Gateway.MicrosoftEdge.Commands.AuthorizeEdgeShop:
      required:
      - merchantId
      type: object
      properties:
        merchantId:
          type: string
          description: Gets the merchant id (Edge merchant id is configured in Nexus).
          format: uuid
        merchantReference:
          type:
          - string
          - 'null'
          description: 'Gets the merchant reference for this authorization.

            Edge does not always supply one; if missing, the handler will default it.'
        amount:
          type:
          - number
          - 'null'
          description: Gets the order amount. Nullable to support zero/no-amount orders.
          format: double
        currency:
          type:
          - string
          - 'null'
          description: Gets the order currency.
        redirectCancelUrl:
          type:
          - string
          - 'null'
          description: Gets the url that the user will be redirected to if they cancel the checkout.
        redirectConfirmUrl:
          type:
          - string
          - 'null'
          description: Gets the url that the user will be redirected to after they have completed the checkout.
        canLink:
          type:
          - boolean
          - 'null'
          description: When true, Zip will return a refresh token to the merchant during the callback so the user can be linked across sessions.
        rememberMeKey:
          type:
          - string
          - 'null'
          description: Gets the RememberMeKey used to fetch a refresh token from FEO.
        publicKey:
          type:
          - string
          - 'null'
          description: 'Gets the merchant''s public key used by the frontend to encrypt the exit payload

            (card details and refresh token) before posting back to the redirect confirm URL.'
        skipEstimate:
          type:
          - boolean
          - 'null'
          description: When true, the frontend will not prompt the customer for an order amount.
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: Please insert JWT with Bearer into field
      flows:
        implicit:
          authorizationUrl: https://login-dev.quadpay.com/authorize
          scopes: {}
