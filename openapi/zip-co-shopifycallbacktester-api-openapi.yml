openapi: 3.2.0
info:
  title: Gateway Shopify Callback Tester API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: ShopifyCallbackTester
paths:
  /payments_apps/api/2022-04/graphql.json:
    post:
      tags:
      - ShopifyCallbackTester
      operationId: PostGraphQLRequest
      parameters:
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: object
              additionalProperties: {}
          application/json:
            schema:
              type: object
              additionalProperties: {}
          text/json:
            schema:
              type: object
              additionalProperties: {}
          application/*+json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          description: OK
      summary: Post graph QL request
      x-summary-source: derived
components:
  securitySchemes:
    Bearer:
      type: oauth2
      description: Please insert JWT with Bearer into field
      flows:
        implicit:
          authorizationUrl: https://login-dev.quadpay.com/authorize
          scopes: {}
