openapi: 3.2.0
info:
  title: Gateway Transaction Testing API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: TransactionTesting
paths:
  /google/testing/orders/{orderId}:
    get:
      tags:
      - TransactionTesting
      summary: Gets a Google order by order id
      operationId: GetOrderById
      parameters:
      - name: OrderId
        in: path
        description: Gets or sets the OrderId
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadPay.Gateway.Orders.Queries.GetOrderById_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
  /google/testing/customers/{customerId}/orders:
    get:
      tags:
      - TransactionTesting
      summary: Gets all Google Orders for a specific customer
      operationId: GetOrdersByCustomerId
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: MerchantId
        in: query
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadPay.Gateway.Orders.Queries.GetOrdersByCustomerId_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
components:
  schemas:
    QuadPay.Gateway.Orders.Queries.GetOrdersByCustomerId_Result:
      type: object
      properties:
        moreInfoUrl:
          type:
          - string
          - 'null'
        orders:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.OrderDetailSummary'
      additionalProperties: false
    QuadPay.Gateway.CustomerPortal.Models.OrderDetailStatus:
      enum:
      - Completed
      - Refunded
      type: string
      description: 'Enum to represent an order status.

        This is only used by Google for now (No other merchants are retrieving Order Details).'
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
