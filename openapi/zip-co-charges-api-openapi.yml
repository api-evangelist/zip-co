openapi: 3.2.0
info:
  title: Gateway Charges API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: Charges
paths:
  /global/v1/charges:
    post:
      tags:
      - Charges
      summary: Creates or captures a charge on an existing checkout.
      operationId: CreateCharge
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.CreateChargeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.ChargeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /global/v1/charges/{chargeId}/capture:
    post:
      tags:
      - Charges
      summary: Captures an existing charge.
      operationId: CaptureCharge
      parameters:
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.CaptureChargeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.ChargeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /global/v1/charges/{chargeId}:
    get:
      tags:
      - Charges
      summary: Retrieves a charge by ID
      operationId: GetCharge
      parameters:
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: merchantId
        in: query
        schema:
          type: string
          format: uuid
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.GetChargeResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /global/v1/charges/{chargeId}/refund:
    post:
      tags:
      - Charges
      summary: Refunds an existing charge.
      operationId: RefundCharge
      parameters:
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.RefundChargeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.ChargeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /global/v1/charges/{chargeId}/cancel:
    post:
      tags:
      - Charges
      summary: Voids (cancels) an existing charge.
      operationId: VoidCharge
      parameters:
      - name: chargeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.VoidChargeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.USPartnerPlatform.Models.ChargeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
