openapi: 3.2.0
info:
  title: Gateway Orders API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: Orders
paths:
  /google/orders/authorize:
    get:
      tags:
      - Orders
      summary: Creates a new context for the QPAW rails on Checkout Anywhere.
      operationId: AuthorizeGoogleOrder
      parameters:
      - name: MerchantId
        in: query
        description: Gets or sets the merchant ID.
        schema:
          type: string
          format: uuid
      - name: Metadata
        in: query
        description: 'Gets or sets optional metadata attached to the checkout.

          Possible values

          1) Apk (If the order was initiated from an app)

          2) Url (If the order was initiated from a merchant website)

          3) Id (If google pay order)'
        schema:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
      - name: Order.Amount
        in: query
        description: Gets or sets the order amount (Includes tax + shipping).
        schema:
          type: number
          format: double
      - name: Order.Currency
        in: query
        description: Gets or sets the currency of the order amount (defaults to TerritorySettings).
        schema:
          type: string
      - name: Order.SkipEstimate
        in: query
        description: 'If this is true and order amount is not null, we will not prompt the customer for an amount in CKOA.

          If this is true and order amount is null, we need to prompt the user for an amount in CKOA.

          If this is false, we need to prompt the user for an amount in CKOA.

          Used by Edge for now / Chrome Autofill will eventually use this.

          Nullable because not all merchants are using this.'
        schema:
          type: boolean
      - name: Customer.FirstName
        in: query
        description: Gets or sets the customer's first name.
        schema:
          type: string
      - name: Customer.LastName
        in: query
        description: Gets or sets the customer's last name.
        schema:
          type: string
      - name: Customer.Email
        in: query
        description: Gets or sets the customer's email address.
        schema:
          type: string
      - name: Customer.Phone
        in: query
        description: Gets or sets the customer's phone number.
        schema:
          type: string
      - name: Customer.DateOfBirth
        in: query
        description: Gets or sets the customer's date of birth.
        schema:
          type: string
          format: date-time
      - name: Customer.BillingAddress.Line1
        in: query
        description: Gets or sets the first address line.
        schema:
          type: string
      - name: Customer.BillingAddress.Line2
        in: query
        description: Gets or sets the second address line.
        schema:
          type: string
      - name: Customer.BillingAddress.City
        in: query
        description: Gets or sets the city.
        schema:
          type: string
      - name: Customer.BillingAddress.State
        in: query
        description: Gets or sets the state or province.
        schema:
          type: string
      - name: Customer.BillingAddress.PostalCode
        in: query
        description: Gets or sets the postal code.
        schema:
          type: string
      - name: Customer.BillingAddress.Country
        in: query
        description: Gets or sets the country.
        schema:
          type: string
      - name: Customer.CanLink
        in: query
        description: 'If this property is set to true, Zip will return a refreshToken/expiresIn value to the merchant during the callback

          Used by Edge for now.'
        schema:
          type: boolean
      - name: RedirectCancelUrl
        in: query
        description: Gets or sets the url that the user will be redirected to if they cancel the checkout.
        schema:
          type: string
      - name: RedirectConfirmUrl
        in: query
        description: Gets or sets the url that the user will be redirected to after they have completed the checkout.
        schema:
          type: string
      - name: MerchantReference
        in: query
        description: Gets or sets the merchant reference of the checkout.
        schema:
          type: string
      - name: TestData.BypassOTPEmail
        in: query
        description: This to bypass OTP by using the auth-mock token.
        schema:
          type: string
      - name: RememberMeKey
        in: query
        description: Gets or sets jwtToken RememberMeKey for fetching RefreshToken from FEO.
        schema:
          type: string
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadPay.Gateway.CheckoutAnywhere.Results.AuthorizeCheckoutAnywhereResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /checkoutanywhere/orders/authorize:
    post:
      tags:
      - Orders
      summary: Creates a new context for the QPAW rails on Checkout Anywhere via a POST…
      operationId: PostAuthorizeCheckoutAnywhereOrder
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.CheckoutAnywhere.Commands.AuthorizeCheckoutAnywhere'
          application/json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.CheckoutAnywhere.Commands.AuthorizeCheckoutAnywhere'
          text/json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.CheckoutAnywhere.Commands.AuthorizeCheckoutAnywhere'
          application/*+json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.CheckoutAnywhere.Commands.AuthorizeCheckoutAnywhere'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuadPay.Gateway.CheckoutAnywhere.Results.AuthorizeCheckoutAnywhereResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
  /orders/authorize:
    post:
      tags:
      - Orders
      summary: Creates a new checkout context and redirects to the checkout website using…
      operationId: AuthorizeOrderPost
      parameters:
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.Orders.Commands.AuthorizeOrder'
      responses:
        '302':
          description: Found
    get:
      tags:
      - Orders
      summary: Creates a new checkout context and redirects to the checkout website using…
      operationId: AuthorizeOrderGet
      parameters:
      - name: OrderId
        in: query
        description: Gets or sets the unique ID to use for order creation
        schema:
          type: string
          format: uuid
      - name: MerchantId
        in: query
        description: Gets or sets the merchant Id.
        schema:
          type: string
          format: uuid
      - name: MerchantConfiguration.Name
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.ClientId
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.ClientSecret
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.MinimumOrderAmount
        in: query
        schema:
          type: integer
          format: int32
          deprecated: true
      - name: MerchantConfiguration.MaximumOrderAmount
        in: query
        schema:
          type: integer
          format: int32
          deprecated: true
      - name: MerchantConfiguration.ProductScheduleOptions
        in: query
        schema:
          type: object
          properties:
            None:
              $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.ScheduleOptions'
            Classic:
              $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.ScheduleOptions'
            PayIn3Months:
              $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.ScheduleOptions'
            PayIn6Months:
              $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.ScheduleOptions'
            PayIn12Months:
              $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.ScheduleOptions'
          additionalProperties: false
      - name: MerchantConfiguration.NetworkIdRegex
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.NetworkNameRegex
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.SettlementDelaySeconds
        in: query
        schema:
          type: integer
          format: int32
      - name: MerchantConfiguration.IsEnabled
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.IsIntegrationVerified
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.FeeSettings.Currency
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.FeeSettings.Percent
        in: query
        schema:
          type: number
          format: double
      - name: MerchantConfiguration.FeeSettings.FlatFee
        in: query
        schema:
          type: number
          format: double
      - name: MerchantConfiguration.FeeSettings.Bands
        in: query
        schema:
          type: object
          additionalProperties:
            type: number
            format: double
      - name: MerchantConfiguration.FeeSettings.RequiresMfppCalculation
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.FeeSettings.IsMerchantFeeForPaymentPlanCosmetic
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.DeferredOrderExpirationConfirmation
        in: query
        schema:
          type: integer
          format: int64
      - name: MerchantConfiguration.DeferFundsCapture
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.ExpressOverAuthBuffer
        in: query
        schema:
          type: number
          format: double
      - name: MerchantConfiguration.OverAuthBuffer
        in: query
        schema:
          type: number
          format: double
      - name: MerchantConfiguration.ShouldVirtualCardRemainOpen
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.IsLongDurationLendingEnabled
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.LongDurationLendingMinimumAmount
        in: query
        schema:
          type: number
          format: double
      - name: MerchantConfiguration.LongDurationLendingMaximumAmount
        in: query
        schema:
          type: number
          format: double
      - name: MerchantConfiguration.ECommercePlatformAccessToken
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.CanStartCheckout
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.CanDoOrderPurchasingOperations
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.CanDoOrderRefundingOperations
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.CanRetrieveReporting
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.BrandingType
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.BankPartner
        in: query
        schema:
          $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.BankPartner'
      - name: MerchantConfiguration.MerchantType
        in: query
        schema:
          $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.MerchantType'
      - name: MerchantConfiguration.CallbackDomains
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.CallbackDomain'
      - name: MerchantConfiguration.CustomerFee.CustomerFeeTiers
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.FeeTier'
      - name: MerchantConfiguration.IsPreQualificationsEnabled
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.PaymentSchedules
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.PaymentSchedule'
      - name: MerchantConfiguration.TokenizationConfiguration.IsEnabled
        in: query
        schema:
          type: boolean
      - name: MerchantConfiguration.TokenizationConfiguration.TokenizationProvider
        in: query
        schema:
          $ref: '#/components/schemas/QuadPay.Domain.Core.Enums.TokenizationProvider'
      - name: MerchantConfiguration.TokenizationConfiguration.GravyConfiguration.GravyMerchantId
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.TokenizationConfiguration.GravyConfiguration.GravyPaymentServiceId
        in: query
        schema:
          type: string
          format: uuid
      - name: MerchantConfiguration.ParentMerchantAssociations
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.MerchantAssociation'
      - name: MerchantConfiguration.ChildMerchantAssociations
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Persistence.Merchants.ReadModel.Models.MerchantAssociation'
      - name: MerchantConfiguration.PlatformMerchantMapping.MerchantId
        in: query
        schema:
          type: string
          format: uuid
      - name: MerchantConfiguration.PlatformMerchantMapping.Platform
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.PlatformMerchantMapping.PlatformAccountId
        in: query
        schema:
          type: string
      - name: MerchantConfiguration.Id
        in: query
        schema:
          type: string
          format: uuid
      - name: MerchantConfiguration.StreamEventNumber
        in: query
        schema:
          type: integer
          format: int64
      - name: MerchantConfiguration.StreamPosition
        in: query
        schema:
          maxLength: 150
          type: string
      - name: MerchantConfiguration.HasStreamProcessingFaulted
        in: query
        schema:
          type: boolean
      - name: Order.AddOns
        in: query
        description: Gets or sets the AddOnRequest that are apart of this order
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.AddOnRequest'
      - name: Order.FirstName
        in: query
        description: Gets or sets the customer's first name.
        schema:
          type: string
      - name: Order.LastName
        in: query
        description: Gets or sets the customer's last name.
        schema:
          type: string
      - name: Order.Email
        in: query
        description: Gets or sets the customer's email address.
        schema:
          type: string
      - name: Order.Phone
        in: query
        description: Gets or sets the customer's phone number.
        schema:
          type: string
      - name: Order.ShippingAddress.Line1
        in: query
        description: Gets or sets the first address line.
        schema:
          type: string
      - name: Order.ShippingAddress.Line2
        in: query
        description: Gets or sets the second address line.
        schema:
          type: string
      - name: Order.ShippingAddress.City
        in: query
        description: Gets or sets the city.
        schema:
          type: string
      - name: Order.ShippingAddress.State
        in: query
        description: Gets or sets the state or province.
        schema:
          type: string
      - name: Order.ShippingAddress.PostalCode
        in: query
        description: Gets or sets the postal code.
        schema:
          type: string
      - name: Order.ShippingAddress.Country
        in: query
        description: Gets or sets the country.
        schema:
          type: string
      - name: Order.BillingAddress.Line1
        in: query
        description: Gets or sets the first address line.
        schema:
          type: string
      - name: Order.BillingAddress.Line2
        in: query
        description: Gets or sets the second address line.
        schema:
          type: string
      - name: Order.BillingAddress.City
        in: query
        description: Gets or sets the city.
        schema:
          type: string
      - name: Order.BillingAddress.State
        in: query
        description: Gets or sets the state or province.
        schema:
          type: string
      - name: Order.BillingAddress.PostalCode
        in: query
        description: Gets or sets the postal code.
        schema:
          type: string
      - name: Order.BillingAddress.Country
        in: query
        description: Gets or sets the country.
        schema:
          type: string
      - name: Order.Currency
        in: query
        description: Gets or sets the currency the order amount is in (defaults to TerritorySettings).
        schema:
          type: string
      - name: Order.Amount
        in: query
        description: Gets or sets the order amount.  This includes the tax and shipping amounts.
        schema:
          type: number
          format: double
      - name: Order.TaxAmount
        in: query
        description: Gets or sets the optional tax amount.
        schema:
          type: number
          format: double
      - name: Order.ShippingAmount
        in: query
        description: Gets or sets the optional shipping amount.
        schema:
          type: number
          format: double
      - name: Order.LineItems
        in: query
        description: Gets or sets the optional line items of what the user is purchasing.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.LineItem'
      - name: Order.Description
        in: query
        description: Gets or sets a description for the order.
        schema:
          type: string
      - name: Order.OrderNumber
        in: query
        description: Gets or sets the QuadPay order number.
        schema:
          type: string
      - name: ShippingPreference.AllowedShippingLocations
        in: query
        description: List of states/countries the merchant will ship to.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.ShippingPreference_ShippingLocation'
      - name: ShippingPreference.DeniedShippingLocations
        in: query
        description: List of states/countries the merchant will not ship to.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.ShippingPreference_ShippingLocation'
      - name: ShippingPreference.DeniedPOBoxShippingLocations
        in: query
        description: List of states/countries with PO Boxes the merchant will not ship to
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.ShippingPreference_ShippingLocation'
      - name: Test
        in: query
        description: Gets or sets a value indicating whether this is a test order.
        schema:
          type: boolean
      - name: Capture
        in: query
        description: Gets or sets a value indicating whether this order should be immediately captured.
        schema:
          type: boolean
      - name: RedirectCancelUrl
        in: query
        description: Gets or sets the url that the user will be redirected to if they cancel the checkout.
        schema:
          type: string
      - name: RedirectConfirmUrl
        in: query
        description: Gets or sets the url that the user will be redirected to after they have completed the checkout.
        schema:
          type: string
      - name: Metadata
        in: query
        description: Gets or sets optional metadata attached to the checkout.
        schema:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
      - name: Origin
        in: query
        description: 'Gets or sets the origin of the order. Usually the merchant''s website.

          Can only be set internally.'
        schema:
          type: string
      - name: GatewayHost
        in: query
        description: 'Gets or sets the gateway api host.

          Can only be set internally.'
        schema:
          type: string
      - name: CheckoutType
        in: query
        description: 'Gets or sets the type of the checkout. Defaults to Standard.

          Can only be set internally.'
        schema:
          $ref: '#/components/schemas/QuadPay.Gateway.Checkout.Models.CheckoutType'
      - name: DeferOrderConfirmation
        in: query
        description: 'Gets or sets a value indicating whether or not to confirm the order upon customer checkout completion.  If true, the merchant

          must make a secondary API call to confirm the order and begin the payment plan.  Default is false.'
        schema:
          type: boolean
      - name: CheckoutFlow
        in: query
        description: Gets or sets the checkout flow for this order. Default is standard
        schema:
          $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.CheckoutFlow'
      - name: EntrySource
        in: query
        description: Gets or sets the entry source for this order. Default is EntrySource.Unknown
        schema:
          $ref: '#/components/schemas/QuadPay.Gateway.Orders.Models.EntrySource'
      - name: Expiration
        in: query
        description: Gets or sets a unix timestamp representing the expiration time of the checkout in seconds.
        schema:
          type: integer
          format: int64
      - name: MerchantUrl
        in: query
        description: Gets or sets the merchant's url
        schema:
          type: string
      - name: ReturnToMerchant
        in: query
        description: Gets or sets a boolean dictating if the Zip Checkout will redirect back to the merchant checkout on completion
        schema:
          type: boolean
      - name: TokenizerSubdomain
        in: query
        description: 'Gets or sets a string assigning the tokenizer subdomain, if applicable. For merchants that use tokenizer gateways, such as CardConnect.com

          will have a custom subdomain, i.e. http://{site}.cardconnect.com, that is used to perform callbacks and/or to tokenize the PAN data for the

          virtual purchase. The tokenizer subdomain is set on the QuadPay button and retained through the callback so that virtual checkout can

          formulate an API URL for the merchants tokenizer gateway.'
        schema:
          type: string
      - name: additionalData.lastTransactionDate
        in: query
        description: The date of the customer's last transaction on a merchant's site.
        schema:
          type: string
          format: date-time
      - name: additionalData.accountCreationDate
        in: query
        description: The date the customer's account was created on a merchant's site.
        schema:
          type: string
          format: date-time
      - name: additionalData.customerLoggedIn
        in: query
        description: Indicates whether the customer is currently logged on a merchant's site.
        schema:
          type: boolean
      - name: additionalData.CustomerIsMember
        in: query
        description: Indicates whether the customer is a member of the merchant's site.
        schema:
          type: boolean
      - name: additionalData.MerchantRiskAssessment
        in: query
        description: The risk assessment score for the merchant.
        schema:
          type: string
      - name: additionalData.SameDevice
        in: query
        description: Indicates whether the transaction was performed from the same device.
        schema:
          type: boolean
      - name: additionalData.FulfillmentMethod
        in: query
        description: The method used to fulfill the order on a merchant's site.
        schema:
          type: string
      - name: additionalData.CustomerTransactionCount
        in: query
        description: The total number of transactions made by the customer on a merchant's site.
        schema:
          type: integer
          format: int32
      - name: additionalData.CustomerAverageOrderValue
        in: query
        description: 'The average order value of the customer''s transactions on a merchant''s site.

          Example format: 123.45 or 123'
        schema:
          type: string
      - name: additionalData.CustomerFraudIncidents
        in: query
        description: Indicates whether the customer has previous fraud incidents.
        schema:
          type: boolean
      - name: PublicKey
        in: query
        schema:
          type: string
      - name: RememberMeKey
        in: query
        description: Gets or sets the Remember Me JWE token for fetching a refresh token during checkout (CKO).
        schema:
          type: string
      - name: SdkSource
        in: query
        description: Gets or sets the SDK source for this order, used to distinguish traffic origin in telemetry.
        schema:
          type: string
      - name: MerchantReference
        in: query
        description: 'Gets or sets the unique merchant reference for this authorization.

          Placed after SdkSource to avoid blocking TelemetryTracingBehavior iteration when null.'
        schema:
          type: string
      - name: BrandName
        in: query
        description: 'Gets or sets the brand name of the merchant for this order.

          Placed after SdkSource to avoid blocking TelemetryTracingBehavior iteration when null.'
        schema:
          type: string
      - name: CallbackUrl
        in: query
        description: 'Gets or sets the status callback url.

          Placed after SdkSource to avoid blocking TelemetryTracingBehavior iteration when null.'
        schema:
          type: string
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      responses:
        '302':
          description: Found
  /orders/authorize-classic-api-sdk:
    post:
      tags:
      - Orders
      summary: Pop-out classic checkout.
      operationId: AuthorizeSdkApiOrderPost
      parameters:
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuadPay.Gateway.Orders.Commands.AuthorizeOrder'
      responses:
