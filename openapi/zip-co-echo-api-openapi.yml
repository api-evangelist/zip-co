openapi: 3.2.0
info:
  title: Gateway Echo API
  version: '1.0'
servers:
- url: https://gateway.sand.us.zip.co
  description: Sandbox
tags:
- name: Echo
paths:
  /stripe-direct/v1/echo_test:
    post:
      tags:
      - Echo
      operationId: EchoTest
      parameters:
      - name: api-version
        in: query
        description: The requested API version
        schema:
          type: string
          default: '1.0'
      - name: QP-Territory
        in: header
        description: Territory of the request
        required: true
        schema:
          enum:
          - US
          - CA
          - GB
          type: string
          default: US
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zip.Gateway.StripeDirect.Models.V1.EchoRequest'
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zip.Gateway.StripeDirect.Models.V1.EchoResponse'
      summary: Echo test
      x-summary-source: derived
components:
  schemas:
    Zip.Gateway.StripeDirect.Models.V1.EchoResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
      additionalProperties: false
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Zip.Gateway.StripeDirect.Models.V1.EchoRequest:
      type: object
      properties:
        timestamp:
          type:
          - integer
          - 'null'
          format: int64
        livemode:
          type:
          - boolean
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: Please insert JWT with Bearer into field
      flows:
        implicit:
          authorizationUrl: https://login-dev.quadpay.com/authorize
          scopes: {}
