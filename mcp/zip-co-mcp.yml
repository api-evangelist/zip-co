name: Zip MCP Server (candidate)
description: 'Candidate MCP tool list DERIVED from the public operations of the Zip Gateway Api OpenAPI (gateway.sand.us.zip.co swagger). Zip
  does not publish an MCP server for its merchant APIs: a web search found none (results were unrelated "Zip" products: a ZIP-archive MCP and
  the Zip procurement platform), and the provider llms.txt indexes name no MCP. Observed, not called: docs.us.zip.co/mcp and developers.zip.co/mcp
  answer GET 200 with the ReadMe platform message "This URL can only be accessed with a MCP client.", but the docs project config embedded in
  the pages has "mcp":{"state":"disabled"}, so it is not treated as an advertised endpoint and no JSON-RPC was sent.'
type: MCPServer
status: candidate
generated: '2026-10-20'
method: derived
source:
- openapi/zip-co-gateway-api-openapi.yml
- https://docs.us.zip.co/llms.txt
- https://developers.zip.co/llms.txt
deployment:
  mode: none
  auth: api-key
  verified: derived
  note: Underlying REST API uses Bearer auth (securityScheme Bearer). No MCP server is shipped by Zip.
observed:
- url: https://docs.us.zip.co/mcp
  status: 200
  method: GET
  body: This URL can only be accessed with a MCP client.
  note: ReadMe docs-platform route; project config mcp.state=disabled; not called with JSON-RPC
- url: https://developers.zip.co/mcp
  status: 200
  method: GET
  body: This URL can only be accessed with a MCP client.
  note: same ReadMe platform route; not called with JSON-RPC
excluded: Operations under /internal, /stripe-direct, /edge, /google, /api/v1, Shopify tester and *testing* paths are partner/internal and are
  not offered as candidate tools.
tools:
- name: create_charge
  operationId: CreateCharge
  method: POST
  path: /global/v1/charges
  description: Creates or captures a charge on an existing checkout.
  readOnly: false
- name: capture_charge
  operationId: CaptureCharge
  method: POST
  path: /global/v1/charges/{chargeId}/capture
  description: Captures an existing charge. Idempotency-Key header is optional; when omitted, the request is not idempotent.
  readOnly: false
- name: get_charge
  operationId: GetCharge
  method: GET
  path: /global/v1/charges/{chargeId}
  description: Retrieves a charge by ID.
  readOnly: true
- name: refund_charge
  operationId: RefundCharge
  method: POST
  path: /global/v1/charges/{chargeId}/refund
  description: Refunds an existing charge. Idempotency-Key header is optional; when omitted, the request is not idempotent.
  readOnly: false
- name: void_charge
  operationId: VoidCharge
  method: POST
  path: /global/v1/charges/{chargeId}/cancel
  description: Voids (cancels) an existing charge. Idempotency-Key header is optional; when omitted, the request is not idempotent.
  readOnly: false
- name: create_checkout
