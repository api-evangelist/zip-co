name: Zip

description: Zip (Zip Co Ltd) is a global Buy Now Pay Later (BNPL) and digital wallet platform that enables merchants to offer flexible payment
  plans to consumers at checkout. Zip provides REST APIs for checkout integration, order creation, payment capture, refunds, voids, merchant management,
  disputes, and consumer payment plan verification, documented on its developer portal (developers.zip.co) and its US documentation site (docs.us.zip.co).
  The platform supports in-store, online, and ecommerce plugin integrations across Australia, New Zealand, the United States, Canada, and other
  markets.

