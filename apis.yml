apis:
- name: Zip Global Merchant API
  description: >
    The Zip Global Merchant API provides checkout, charge, capture, refund, and cancellation operations
    for merchants integrating Zip BNPL payments into their online storefront. It uses Bearer token authentication
    and supports idempotent requests.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.zip.co/reference/api-docs
  baseURL: https://sand.merchant-api.com
